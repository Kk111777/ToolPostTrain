  source_split: train_drop_last_tail
  fixed_rows: 80
  fixed_order: true
  steps:
  - 0
  - 7
  - 14
  - 21
  - 28
  - 35
  optimizer_step: false
  test_freq: 7
  val_before_train: true
  val_kwargs:
    n: 1
    temperature: 0
    do_sample: false
    top_k: -1
    top_p: 1.0
  common_across_algorithms: true
  metrics:
  - accuracy_reward
  - format_reward
  - total_reward
  - tool_call_parse_rate
  - response_only_wrapper_rate
  - generation_length
  - native_validation_metrics
  paired_budget_decision:
    comparison: step28_vs_step35
    pair_key: source_row
    statistics:
    - mean_paired_difference_total_reward
    - mean_paired_difference_accuracy_reward
    - improved_prompt_fraction
    - percentile_bootstrap_95_ci
    bootstrap_resamples: 10000
    bootstrap_seed: 42
    ci: percentile_95
    continuation_rule: Small change with CI crossing zero is no clear benefit; continue
      only for stable positive improvement without format/parse/KL regression.
  test_policy:
    path: /root/autodl-tmp/ProjectB/repo/verl-GDPO/dataset/rlla_4k/test.parquet
    intermediate_eval: forbidden
    budget_selection: forbidden
    hyperparameter_selection: forbidden
    checkpoint_selection: forbidden
    final_evaluation: one evaluation per final GRPO/GDPO checkpoint after common budget
      is frozen
  kl_note: Validation does not natively compute actor/reference KL; retain training
    actor/ppo_kl separately and do not label it held-out eval KL.
